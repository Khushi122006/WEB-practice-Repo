<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animation</title>

    <style>
        .box {
            height: 70px;
            width: 70px;
            border: 2px solid black;
            border-radius: 5px;
            background-color: rgb(185, 19, 19);

            position: relative;
            top: 10px;
            left: 10px;

            animation: moviBox 2s infinite;
            animation-iteration-count: 5;
        }

        @keyframes movieBox {
            from {
                left: 10px;
            }

            to {
                left: 200px;
            }
        }
    </style>
</head>

<body>

    <div class="box">Animation</div>

</body>

</html>

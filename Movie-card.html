<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Card</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f3ff;
            margin: 0;
        }

        .parent {
            padding: 40px;

            display: grid;
            grid-template-columns: repeat(3, 205px);
            justify-content: center;
            gap: 20px;
        }

        .movie-card {
            width: 205px;
            background-color: white;

            border: 1px solid #ddd;
            border-radius: 16px;
            overflow: hidden;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

            animation-name: animationCard;
            animation-duration: 1s;
            animation-fill-mode: both;

            cursor: pointer;
        }

        .movie-card:hover {
            transform: translateY(10px);
        }

        .movie-card img {
            width: 205px;
            height: 270px;

            object-fit: cover;
            display: block;
        }

        /* Movie information area */
        .movie-info {
            padding: 14px;
            height: 150px;

            display: flex;
            flex-direction: column;
        }

        .movie-title {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .movie-details {
            font-size: 14px;
            color: #555;
        }

        /* Button */
        .button {
            background-color: black;
            color: white;

            border: none;
            border-radius: 5px;

            padding: 7px 12px;

            cursor: pointer;

            margin-top: auto;
        }

        .button:hover {
            background-color: #333;
        }

        /* Animation delay */

        .movie-card:nth-child(1) {
            animation-delay: 0.5s;
        }

        .movie-card:nth-child(2) {
            animation-delay: 0.8s;
        }

        .movie-card:nth-child(3) {
            animation-delay: 1s;
        }

        .movie-card:nth-child(4) {
            animation-delay: 1.3s;
        }

        .movie-card:nth-child(5) {
            animation-delay: 1.6s;
        }

        .movie-card:nth-child(6) {
            animation-delay: 1.9s;
        }

        @keyframes animationCard {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* Popup */

        .popup {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-color: rgba(0, 0, 0, 0.7);

            justify-content: center;
            align-items: center;

            z-index: 1000;
        }

        .popup-content {
            background-color: white;

            width: 400px;

            padding: 25px;

            border-radius: 15px;

            text-align: center;

            position: relative;

            animation: popupAnimation 0.3s ease;
        }

        .popup-content img {
            width: 180px;
            height: 240px;

            object-fit: cover;

            border-radius: 10px;
        }

        .popup-title {
            font-size: 24px;

            font-weight: bold;

            margin-top: 15px;
        }

        .popup-details {
            font-size: 15px;

            color: #555;

            margin-top: 10px;
        }

        .close {
            position: absolute;

            top: 8px;
            right: 15px;

            font-size: 30px;

            cursor: pointer;
        }

        @keyframes popupAnimation {

            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

    </style>

</head>
